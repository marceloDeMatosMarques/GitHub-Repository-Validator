[pytest]
# Configuração do pytest para o projeto

# Diretório de testes
testpaths = app/tests

# Padrão de nomes de arquivos de teste
python_files = test_*.py

# Padrão de nomes de classes de teste
python_classes = Test*

# Padrão de nomes de funções de teste
python_functions = test_*

# Usar asyncio para testes async
asyncio_mode = auto

# Verbose output
addopts = -v --tb=short

# Markers personalizados
markers =
    asyncio: marca teste como async (necessita pytest-asyncio)
    unit: marca teste como unitário
    integration: marca teste como integração
    slow: marca teste como lento
